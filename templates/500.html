{% extends 'base.html' %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 text-center">
        <div class="display-1 text-warning fw-bold"><i class="bi bi-shield-x"></i> 500</div>
        <h2 class="mt-3 fw-bold text-dark">Cadastral Validation Server Error</h2>
        <p class="lead text-muted mt-2">
            An unexpected error occurred while processing cadastral computations or geospatial verification.
        </p>
        <div class="mt-4">
            <a href="{% url 'home' %}" class="btn btn-primary">
                <i class="bi bi-house-door me-1"></i> Return to Safety
            </a>
        </div>
    </div>
</div>
{% endblock %}
